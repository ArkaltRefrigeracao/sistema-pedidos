<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}
        <form method="post">
            <label>Login:</label><br>
            <input type="text" name="login" required><br><br>
            <label>Senha:</label><br>
            <input type="password" name="senha" required><br><br>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
